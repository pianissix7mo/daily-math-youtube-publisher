name: Schedule Daily Math Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Release tag containing the master ZIP and START_DATE
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: daily-math-publisher-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out publisher
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve Release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          fi

      - name: Download exactly one master ZIP and Release schedule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input state-cache

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body // ""' > input/release-body.txt
          test -s input/release-body.txt || {
            echo "Release description is empty. Add START_DATE=YYYY-MM-DD"
            exit 1
          }
          echo "RELEASE_BODY_PATH=input/release-body.txt" >> "$GITHUB_ENV"

          mapfile -t zips < <(
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name | select(test("\\.[zZ][iI][pP]$"))'
          )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP Release asset, found ${#zips[@]}"
            printf '%s\n' "${zips[@]:-}"
            exit 1
          fi

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${zips[0]}" --dir input
          ZIP_PATH="input/${zips[0]}"
          test -s "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'upload-state.json' --dir state-cache || true

      - name: Validate full package and schedule sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_MATH_TOKEN_JSON: ${{ secrets.YOUTUBE_MATH_TOKEN_JSON }}
          EXPECTED_MATH_CHANNEL_ID: ${{ secrets.EXPECTED_MATH_CHANNEL_ID }}
        run: |
          python scripts/run_schedule.py "$ZIP_PATH" \
            --release-body "$RELEASE_BODY_PATH" \
            --release-tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --release-state state-cache/upload-state.json \
            --history state/upload-history.json

      - name: Delete successful Release and tag
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "All Daily Math videos were scheduled successfully. Cleaning up Release: $RELEASE_TAG"
          gh release delete "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag
          echo "Release and tag deleted: $RELEASE_TAG"
